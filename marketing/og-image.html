<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; font-family: 'Inter', sans-serif; background: #fffaf6; display: flex; align-items: center; overflow: hidden; }
  .text { flex: 1.2; padding: 0 20px 0 70px; }
  .text img.logo { height: 110px; margin-bottom: 28px; }
  h1 { font-family: 'Playfair Display', serif; font-size: 58px; color: #2c3e50; line-height: 1.12; }
  h1 .hl { color: #e8725a; }
  p { font-size: 26px; color: #5a6878; margin-top: 22px; line-height: 1.45; }
  .badge { display: inline-block; margin-top: 26px; background: #e8725a; color: #fff; font-size: 22px; font-weight: 600; padding: 10px 26px; border-radius: 999px; }
  .illu { flex: 1; display: flex; justify-content: center; }
  .illu img { height: 540px; }
</style>
</head>
<body>
  <div class="text">
    <img class="logo" src="logo-orig.png" alt="Zeitnest">
    <h1>Zeit schenken.<br><span class="hl">Zeit gewinnen.</span></h1>
    <p>Kostenlose Plattform für Wunschgroßeltern &amp; freiwillige Kinderbetreuung — sicher und geprüft.</p>
    <div class="badge">zeitnest.org</div>
  </div>
  <div class="illu"><img src="illu-dorf.png" alt=""></div>
</body>
</html>
